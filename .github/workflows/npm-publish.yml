name: Publish to npm

on:
  push:
    tags:
      - v*

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve publish mode and verify version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RAW_VERSION="${TAG#v}"
          NPM_TAG="latest"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$RAW_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version and package version are not synchronized."
            echo "tag: ${TAG}"
            echo "expected package.json version: ${RAW_VERSION}"
            echo "actual package.json version: ${PACKAGE_VERSION}"
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ -beta(\.|$) ]]; then
            NPM_TAG="beta"
          fi

          echo "Version check passed: ${TAG} -> ${PACKAGE_VERSION} (npm tag: ${NPM_TAG})"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish package to npm
        shell: bash
        run: |
          # Remove setup-node token config if present so npm can use trusted publishing.
          NPMRC_FILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [[ -f "$NPMRC_FILE" ]]; then
            sed -i '/_authToken/d' "$NPMRC_FILE"
          fi
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN

          if [[ "${{ steps.release.outputs.npm_tag }}" == "beta" ]]; then
            npm publish --provenance --tag beta --registry https://registry.npmjs.org
          else
            npm publish --provenance --registry https://registry.npmjs.org
          fi
